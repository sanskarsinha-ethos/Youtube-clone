<!DOCTYPE html>
<html>
  <head>
    <title>
      YouTube.com Clone
    </title>
    <style>
      .thumbnail{
        width:300px;
        display:block;       
      }
      .textbox{
        font-size:20px;
        margin-left:12px;
        display:block;
      }
      .marques-title{
        width:300px; 
      }
      .video-preview{
        width:300px;
        display:inline-block;
      }

      .markthumbnail{
        width:300px;
        display:block;       
      }
  
      .mark-title{
        width:300px; 
      }
      .mark-preview{
        width:300px;
        display:inline-block;
      }

 
    </style>
  </head>
  <body>
      <input class="textbox" type="textbox" placeholder="Search">
    
    <div class="video-preview">
      <img class="thumbnail" src="thumbnails/thumbnail-1.webp">
  
    <p class="marques-title" >
      <strong>Talking Tech and AI with Google CEO Sundar Pichai!</strong>
    </p>
    <p class="marques">
      Marques Brownlee 
    </p>
    <p class="marques-views">
      3.4M views &#183; 6 months ago
    </p>
    </div>

    <div class="mark-preview">
      <img class="markthumbnail" src="thumbnails/thumbnail-2.webp">
  
    <p class="mark-title" >
      <strong>
        Try Not To Laugh Challenge #9
      </strong>
    </p>
    <p class="mark">
      Markiplier 
    </p>
    <p class="mark-views">
      19M views &#183; 4 years ago
    </p>
    </div>
  
  
  </body> 
</html>
